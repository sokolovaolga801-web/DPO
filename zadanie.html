<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Иерархия НПА — производственный контроль на ОПО</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: #1f2937;
  }

  .card {
    width: 700px;
    height: 650px;
    max-width: 100%;
    max-height: 100vh;
    background: #ffffff;
    border: 1px solid #e6eaf0;
    border-radius: 22px;
    padding: 26px 30px 22px;
    box-shadow: none;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 20px;
    line-height: 1.35;
    margin: 0 0 18px;
    color: #0f172a;
  }

  /* ---------- Список ---------- */
  .list {
    list-style: none;
    padding: 0;
    margin: 0 0 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f5f7fc;
    border: 2px solid #e2e8f2;
    border-radius: 14px;
    padding: 11px 14px;
    font-size: 14px;
    line-height: 1.35;
    cursor: grab;
    transition: background .18s, border-color .18s, transform .12s, box-shadow .18s;
    user-select: none;
  }

  .item:hover { border-color: #c9d6ea; }
  .item:active { cursor: grabbing; }
  .item.dragging { opacity: .35; transform: scale(.99); }

  .num {
    flex: 0 0 28px;
    height: 28px;
    border-radius: 50%;
    background: #dce5f5;
    color: #334155;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 12.5px;
    transition: background .18s, color .18s;
  }

  .txt { flex: 1 1 auto; }

  .arrows { display: flex; flex-direction: column; gap: 3px; flex: 0 0 auto; }

  .arrow {
    border: none;
    background: #e8edf7;
    color: #475569;
    width: 27px;
    height: 20px;
    border-radius: 6px;
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .arrow:hover { background: #d2deef; color: #1e3a8a; }
  .arrow:active { transform: scale(.94); }

  /* ---------- Результаты проверки ---------- */
  .item.correct { background: #e9fbf0; border-color: #22c55e; }
  .item.correct .num { background: #22c55e; color: #fff; }

  .item.wrong { background: #fdeeee; border-color: #ef4444; }
  .item.wrong .num { background: #ef4444; color: #fff; }

  /* ---------- Кнопки ---------- */
  .btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: auto; }

  .btn {
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .18s, transform .12s, opacity .18s;
  }
  .btn:active { transform: translateY(1px); }

  .btn-check { background: #2563eb; color: #fff; }
  .btn-check:hover { background: #1d4ed8; }

  .btn-reset { background: #eef2f9; color: #334155; }
  .btn-reset:hover { background: #e0e7f3; }

  .btn-get { background: #16a34a; color: #fff; }
  .btn-get:hover { background: #15803d; }
  .btn-get[hidden] { display: none; }

  /* ---------- Сообщение ---------- */
  .msg {
    margin-top: 12px;
    font-size: 14px;
    font-weight: 600;
    min-height: 20px;
    transition: color .2s;
  }
  .msg.ok  { color: #15803d; }
  .msg.bad { color: #dc2626; }

  @media (max-width: 740px) {
    body { padding: 10px; }
    .card {
      width: 100%;
      height: auto;
      min-height: 650px;
      max-height: none;
      padding: 22px 18px 20px;
      border-radius: 18px;
    }
    h1 { font-size: 18px; }
    .item { font-size: 13px; padding: 10px 12px; }
    .btn { flex: 1 1 auto; padding: 11px 16px; font-size: 13.5px; }
  }
</style>
</head>
<body>

<div class="card">
  <h1>Расположите документы по производственному контролю на ОПО по уровню правовой силы согласно иерархии НПА</h1>

  <ul class="list" id="list"></ul>

  <div class="btns">
    <button class="btn btn-check" id="check">Проверить</button>
    <button class="btn btn-reset" id="reset">Сбросить</button>
    <a class="btn btn-get" id="get"
       href="1f61b090-9d69-4fbc-97f6-0141c7ce92fc.docx"
       download="1f61b090-9d69-4fbc-97f6-0141c7ce92fc.docx"
       hidden>Забрать документ ⬇</a>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
(function () {
  "use strict";

  /* ====== Данные: порядок в массиве = ПРАВИЛЬНЫЙ порядок ====== */
  const DATA = [
    { id: 1, text: "Конституция Российской Федерации" },
    { id: 2, text: "Федеральный закон № 116-ФЗ «О промышленной безопасности опасных производственных объектов»" },
    { id: 3, text: "Постановление Правительства РФ от 18.12.2020 № 2168 «Об организации и осуществлении производственного контроля за соблюдением требований промышленной безопасности»" },
    { id: 4, text: "Федеральные нормы и правила в области промышленной безопасности" },
    { id: 5, text: "Положение о производственном контроле ООО «Ромашка»" }
  ];

  const CORRECT_ORDER = DATA.map(function (d) { return d.id; });

  const listEl = document.getElementById("list");
  const msgEl  = document.getElementById("msg");
  const getBtn = document.getElementById("get");

  let state = [];
  let dragEl = null;

  /* ====== Перемешивание ====== */
  function shuffle(arr) {
    let out;
    do {
      out = arr.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
    } while (out.every(function (v, i) { return v === CORRECT_ORDER[i]; }));
    return out;
  }

  /* ====== Отрисовка ====== */
  function render() {
    listEl.innerHTML = "";
    state.forEach(function (id, index) {
      const item = DATA.find(function (d) { return d.id === id; });

      const li = document.createElement("li");
      li.className = "item";
      li.draggable = true;
      li.dataset.id = id;

      const num = document.createElement("span");
      num.className = "num";
      num.textContent = index + 1;

      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = item.text;

      const arrows = document.createElement("span");
      arrows.className = "arrows";

      const up = document.createElement("button");
      up.className = "arrow";
      up.type = "button";
      up.dataset.dir = "-1";
      up.title = "Вверх";
      up.setAttribute("aria-label", "Переместить вверх");
      up.textContent = "▲";

      const down = document.createElement("button");
      down.className = "arrow";
      down.type = "button";
      down.dataset.dir = "1";
      down.title = "Вниз";
      down.setAttribute("aria-label", "Переместить вниз");
      down.textContent = "▼";

      arrows.appendChild(up);
      arrows.appendChild(down);

      li.appendChild(num);
      li.appendChild(txt);
      li.appendChild(arrows);

      listEl.appendChild(li);
    });
  }

  /* ====== Синхронизация состояния ====== */
  function syncState() {
    state = Array.prototype.map.call(listEl.children, function (li) {
      return Number(li.dataset.id);
    });
    Array.prototype.forEach.call(listEl.children, function (li, i) {
      li.querySelector(".num").textContent = i + 1;
    });
  }

  function clearColors() {
    Array.prototype.forEach.call(listEl.children, function (li) {
      li.classList.remove("correct", "wrong");
    });
    msgEl.textContent = "";
    msgEl.className = "msg";
    getBtn.hidden = true;
  }

  /* ====== Перетаскивание ====== */
  listEl.addEventListener("dragstart", function (e) {
    const li = e.target.closest(".item");
    if (!li) return;
    dragEl = li;
    li.classList.add("dragging");
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", li.dataset.id);
    }
  });

  listEl.addEventListener("dragend", function () {
    if (dragEl) dragEl.classList.remove("dragging");
    dragEl = null;
    syncState();
    clearColors();
  });

  listEl.addEventListener("dragover", function (e) {
    if (!dragEl) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = "move";

    const after = getDragAfterElement(listEl, e.clientY);
    if (after === null) {
      listEl.appendChild(dragEl);
    } else if (after !== dragEl) {
      listEl.insertBefore(dragEl, after);
    }
  });

  function getDragAfterElement(container, y) {
    const els = Array.prototype.slice.call(
      container.querySelectorAll(".item:not(.dragging)")
    );
    const result = els.reduce(function (closest, child) {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      }
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY, element: null });
    return result.element;
  }

  /* ====== Стрелки ====== */
  listEl.addEventListener("click", function (e) {
    const btn = e.target.closest(".arrow");
    if (!btn) return;

    const li = btn.closest(".item");
    const dir = Number(btn.dataset.dir);

    if (dir === -1 && li.previousElementSibling) {
      listEl.insertBefore(li, li.previousElementSibling);
    } else if (dir === 1 && li.nextElementSibling) {
      listEl.insertBefore(li.nextElementSibling, li);
    } else {
      return;
    }

    syncState();
    clearColors();
  });

  /* ====== Проверка ====== */
  document.getElementById("check").addEventListener("click", function () {
    const lis = Array.prototype.slice.call(listEl.children);
    let wrongCount = 0;

    lis.forEach(function (li, i) {
      const isCorrect = Number(li.dataset.id) === CORRECT_ORDER[i];
      li.classList.toggle("correct", isCorrect);
      li.classList.toggle("wrong", !isCorrect);
      if (!isCorrect) wrongCount++;
    });

    if (wrongCount === 0) {
      msgEl.textContent = "✅ Всё верно! Документы расположены по иерархии нормативных правовых актов.";
      msgEl.className = "msg ok";
      getBtn.hidden = false;
    } else {
      const word = wrongCount === 1 ? "документ" : (wrongCount < 5 ? "документа" : "документов");
      msgEl.textContent = "❌ Не на своём месте: " + wrongCount + " " + word + ". Попробуйте ещё раз.";
      msgEl.className = "msg bad";
      getBtn.hidden = true;
    }
  });

  /* ====== Сброс ====== */
  document.getElementById("reset").addEventListener("click", function () {
    state = shuffle(CORRECT_ORDER);
    render();
    clearColors();
    msgEl.textContent = "Порядок сброшен. Попробуйте снова!";
    msgEl.className = "msg";
    setTimeout(function () {
      if (msgEl.textContent === "Порядок сброшен. Попробуйте снова!") msgEl.textContent = "";
    }, 2200);
  });

  /* ====== Старт ====== */
  state = shuffle(CORRECT_ORDER);
  render();
})();
</script>
</body>
</html>
